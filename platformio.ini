; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano_33_iot

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
lib_ldf_mode = chain+
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X
    arduino-libraries/NTPClient
    arduino-libraries/WiFiNINA
    paulstoffregen/Time
    jchristensen/Timezone
build_flags =
    -D _DEBUG_
    -std=gnu++17
build_unflags =
    -std=gnu++11
monitor_filters =
    time
    default
monitor_speed = 115200

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<sprinkler_logic.cpp>
